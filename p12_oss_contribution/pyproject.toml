[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-loop-guard"
version = "0.1.0"
description = "Termination safety for LangGraph tool agents: repeat/cycle detection, step & cost budgets, graceful fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ajeetkumar" }]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]

[tool.setuptools]
packages = ["loop_guard"]
